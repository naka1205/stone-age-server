# deploy/docker-compose.yml
# 石器时代 8.0 服务端与存储底座一键编排 (MySQL 8.4 + Redis 8.0 + StoneAge Server)
#
# 依据: docs/00-architecture.md §8 (技术选型 MySQL 8.4 / Redis 8.x / Ubuntu 24.04 LTS)
# 启动方式:
#   docker compose -f deploy/docker-compose.yml up -d
# 停止方式:
#   docker compose -f deploy/docker-compose.yml down

services:
  mysql:
    image: mysql:8.4
    container_name: stone_age_mysql
    restart: unless-stopped
    command:
      - --default-authentication-plugin=caching_sha2_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_ROOT_PASSWORD: stone_root_pwd_2026
      MYSQL_DATABASE: sa_session
      MYSQL_USER: stoneage
      MYSQL_PASSWORD: stone_user_pwd_2026
    ports:
      - "13306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/001-session.sql:/docker-entrypoint-initdb.d/001-session.sql:ro
      - ./sql/002-world-features.sql:/docker-entrypoint-initdb.d/002-world-features.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pstone_root_pwd_2026"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.0-alpine
    container_name: stone_age_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "16379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: stone_age_server
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8300:8300"
    volumes:
      - ../content:/app/content:ro
      - ../config:/app/config:ro
    environment:
      SA_CONFIG: config/demo.json
      SA_LOG_LEVEL: info

volumes:
  mysql_data:
  redis_data:
