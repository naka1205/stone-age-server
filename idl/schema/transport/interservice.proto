// transport/interservice.proto —— 服务间接口的公共头
//
// 00-architecture.md §3.1 / 02-protocol.md §7:两种部署形态共用的唯一形状。
//
// ★★ 进程内形态下,服务之间也只能通过本接口通信,不得有共享内存捷径。
//    本地传输只是 ITransport 的一个实现,不是「可以直接读对方内部状态」的许可。
//    一旦有人在单容器形态下写了「反正同进程,直接读 social 的 map」,
//    生产分布式形态就会以最难查的方式崩掉。

syntax = "proto3";

package sa.transport;

import "sa_options.proto";
import "transport/errors.proto";

// ★ 续体三元组。为什么不是一个自增整数(02 §7.1):
//   SERVSTATE_init() 把 fdid 归零 ⇒ gmsv 每次启动都从 0 重新发放续体号;
//   saac 侧 is_game_server_login() 只检查槽位登录状态、没有世代号
//   ⇒ 重启后旧实例的迟到应答可能命中新实例的同号连接,投递给不相干的玩家。
//   instance_id(哪个实例)+ generation(第几次启动)+ request_id(哪个请求),缺一不可。
message RequestHeader {
  option (sa.transport_only) = true;

  uint32 instance_id = 1;
  uint32 generation  = 2;
  uint64 request_id  = 3;
  uint32 deadline_ms = 4;
}

message ResponseHeader {
  option (sa.transport_only) = true;

  uint64 request_id = 1;
  Status status     = 2;
  // 业务码,与 status 正交。0 表示无业务错误。
  uint32 error_code = 3;
}

// Notify 的应答。⚠️ accepted 只代表入队,不代表持久化。
// ★★ 资产类操作不得走这条路 —— 17 §5.4 实测公共仓库 fire-and-forget 后
//    立刻销毁本地道具对象 ⇒ 道具永久蒸发。资产移动一律「预留 → 提交」两阶段。
message Ack {
  option (sa.transport_only) = true;

  bool accepted = 1;
}
